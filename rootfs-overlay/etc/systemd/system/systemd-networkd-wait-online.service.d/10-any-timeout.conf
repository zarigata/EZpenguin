# Don't stall boot waiting for all interfaces — proceed when any is up.
# Prevents boot hangs on slow DHCP (real hardware) and emulator timing races.
# NB: the binary lives in /usr/lib/systemd, which is NOT on systemd's default
# unit PATH — a bare ExecStart fails with 203/EXEC (observed on the VM boot
# test). Always use the absolute path.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
