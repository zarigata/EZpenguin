# EZpenguin central build configuration
# Sourced by build scripts — plain key=value only.

EZP_NAME="EZpenguin"
EZP_ID="ezpenguin"
EZP_VERSION="0.4.1"
EZP_SUITE="bookworm"
EZP_MIRROR="http://deb.debian.org/debian"
EZP_SECURITY_MIRROR="http://security.debian.org/debian-security"
EZP_ARCH="amd64"
EZP_APT_CACHE_VOLUME="ezpenguin-apt-cache"

# Output
EZP_ARTIFACT_DIR="artifacts"

# Size budget (MB installed) enforced by tests.
# Stock Debian kernel = ~400MB modules (broad HW support, DietPi-parity).
# Competitor reference: DietPi x86_64 compressed image ≈ 240MB.
EZP_MAX_ROOTFS_MB="700"
EZP_MAX_COMPRESSED_MB="300"
EZP_MAX_ISO_MB="500"
