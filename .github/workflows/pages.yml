name: pages

on:
  push:
    branches: [main]
    paths: ['docs/**', 'README.md', 'config/software-catalog.list', 'config/ezpenguin.cfg', 'scripts/**', 'wiki-content/**', 'tests/test_website.py', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/test_website.py
      - run: node --check docs/assets/app.js
      - run: node --check docs/assets/wiki.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
