name: Website checks
on:
  push:
    paths: ['docs/**', 'README.md', 'config/software-catalog.list', 'config/ezpenguin.cfg', 'scripts/**', 'wiki-content/**', 'tests/test_website.py', '.github/workflows/website-checks.yml']
  pull_request:
    paths: ['docs/**', 'README.md', 'config/software-catalog.list', 'config/ezpenguin.cfg', 'scripts/**', 'wiki-content/**', 'tests/test_website.py', '.github/workflows/website-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 tests/test_website.py
      - run: node --check docs/assets/app.js
      - run: node --check docs/assets/wiki.js
